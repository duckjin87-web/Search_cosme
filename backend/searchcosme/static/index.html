<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표시사항 사전검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><h1>표시사항 사전검토</h1><span class="tag" id="engine-tag">사내용</span></div>
  <p class="top-note">제품명으로 찾고, 채널 자료와 사내 사진을 모아 후면 표시사항을 화장품법 기재사항 9개 항목으로 정리합니다.</p>
</header>
<main class="layout">
  <aside class="side">
    <section class="panel" aria-labelledby="q-title">
      <h2 id="q-title" class="panel-title">조회</h2>
      <form id="search-form" class="form">
        <label for="q">제품명 또는 바코드</label>
        <input id="q" type="search" autocomplete="off" placeholder="예: 수분 크림 50ml" required>
        <label for="cat">카테고리</label>
        <select id="cat">
          <option value="">자동 추정</option>
          <option value="container">용기형 (6면)</option>
          <option value="tube">튜브 (전후좌우 + 캡·씰링부)</option>
        </select>
        <fieldset class="row2">
          <legend>수집일 기간 (결과 필터)</legend>
          <div><label for="from">시작</label><input id="from" type="date"></div>
          <div><label for="to">종료</label><input id="to" type="date"></div>
        </fieldset>
        <button type="submit" class="primary">제품 찾기</button>
      </form>
    </section>
    <section class="panel" aria-labelledby="ch-title">
      <h2 id="ch-title" class="panel-title">수집 채널</h2>
      <div id="channels" class="chlist"></div>
    </section>
    <section class="panel" aria-labelledby="p-title">
      <h2 id="p-title" class="panel-title">수집 진행</h2>
      <div id="progress" class="progress"><p class="muted">수집을 실행하면 채널별 진행 상태가 여기에 표시됩니다.</p></div>
    </section>
  </aside>
  <section class="results" aria-live="polite">
    <div id="view"></div>
  </section>
</main>
<footer class="notice" role="note">사전 참고용 도구입니다. 최종 확인은 반드시 실물 또는 도면 기준으로 합니다.</footer>
<script src="/static/app.js"></script>
</body>
</html>
