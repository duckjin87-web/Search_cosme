# 사내 VM 한 대에서 전체 구성 실행:  cp .env.example .env  →  값 채우기  →  docker compose up -d
x-app: &app
  build: .
  env_file: .env
  environment:
    SC_DATABASE_URL: postgresql+psycopg://searchcosme:${POSTGRES_PASSWORD}@postgres:5432/searchcosme
    SC_QUEUE: celery
    SC_REDIS_URL: redis://redis:6379/0
    SC_STORAGE: s3
    SC_S3_ENDPOINT: http://minio:9000
    SC_S3_BUCKET: searchcosme
    SC_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    SC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  depends_on: [postgres, redis, minio]
  restart: unless-stopped

services:
  api:
    <<: *app
    ports: ["${SC_PORT:-8000}:8000"]   # 사내망에서만 열 것
  worker:
    <<: *app
    command: celery -A searchcosme.tasks worker -Q lookups --concurrency 2 --loglevel info
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: searchcosme
      POSTGRES_USER: searchcosme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
